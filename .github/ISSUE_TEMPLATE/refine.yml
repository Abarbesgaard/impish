name: Refinement
description: Anything that isn't a bug in a released version. New behaviour, changes and cleanups all start from a Contract.
title: "refine: "
labels: ["refine"]
body:
  - type: markdown
    attributes:
      value: |
        impish follows [Impatient Programming](https://impatientprogramming.org) (IMP), and holds itself to the same gate it gives you. An issue says what impish must do once the work is done, written as **obligations** that join impish's own [Contract](https://github.com/Abarbesgaard/impish/blob/main/contract/README.md), each proved by a contract test.

        - **Why write it down first?** [Rule 1](https://impatientprogramming.org/rules/#rule-1): before you commit to the work, write down how you'll know it worked.
        - **Why obligations?** [Rule 13](https://impatientprogramming.org/rules/#rule-13) and [rule 20](https://impatientprogramming.org/rules/#rule-20): the Contract is the description of what the software must do, functional and non-functional, and it's executable. `cargo impish check` fails until every obligation has a test.
        - **Why `refine`?** [Rule 9](https://impatientprogramming.org/rules/#rule-9): `fix` is only for a defect in a released version. Found one? Use the **Bug** form instead.

        Rough is fine. The obligations get sharpened while the work is done, and checked against this issue before it merges ([rule 12](https://impatientprogramming.org/rules/#rule-12)).
  - type: textarea
    id: intent
    attributes:
      label: Intent
      description: What should impish do that it doesn't today, and why does it matter? Say who it's for and what they're trying to get done.
      placeholder: |
        When a workspace has several crates, `cargo impish check` should check each member's Contract, so one run covers the whole workspace.
    validations:
      required: true
  - type: dropdown
    id: primitive
    attributes:
      label: Primitive
      description: |
        Which part of the Contract does this belong to? Each primitive is a folder under [contract/](https://github.com/Abarbesgaard/impish/tree/main/contract):
        `attribute` is `#[impish::contract]`, `check` is `cargo impish check`, `cli` is how impish is invoked.
        Pick "A new primitive" if none fits, and name it in the obligations below.
      options:
        - attribute
        - check
        - cli
        - A new primitive
        - Not sure
    validations:
      required: true
  - type: textarea
    id: obligations
    attributes:
      label: Obligations
      description: |
        One block per obligation, in the [Contract's format](https://github.com/Abarbesgaard/impish/blob/main/contract/README.md). Number them A1, A2, … here; they're renumbered to follow the primitive's existing ones when they land, and numbers are never reused.
        - **must:** one observable behaviour a contract test can check from outside: what impish prints, writes, refuses, exits with, or what fails to compile. Not how the code does it. Look at [contract/check/README.md](https://github.com/Abarbesgaard/impish/blob/main/contract/check/README.md) for the style: "fail, naming the file and line, when …".
        - **why:** optional; the reason, when it isn't obvious.
        - **kind:** `functional`, `non-functional` (speed, size, limits, what it leaves untouched), `persisted-format` (file formats impish reads, like the Contract's), `ordering` or `security` (what untrusted input can't make it do).
        - **status:** `active` for a new obligation.

        Cover the failure cases too: what impish refuses, the message it names, and what it leaves untouched when it does.
      value: |
        ### A1 — <a short name for the promise>
        - **must:** <what impish does, observably>
        - **why:** <optional>
        - **kind:** functional
        - **status:** active
      render: markdown
    validations:
      required: true
  - type: textarea
    id: existing
    attributes:
      label: Behaviour this changes
      description: |
        Changing something impish already does? Name the obligations it touches (e.g. `check/A5`) and say what impish does today. [Rule 20](https://impatientprogramming.org/rules/#rule-20): pin the existing behaviour with an obligation before changing it, and find out why each fence is there before you move it; [docs/decisions/](https://github.com/Abarbesgaard/impish/tree/main/docs/decisions) records why. An obligation whose promise changes is retired and replaced, not edited.
  - type: textarea
    id: unknowns
    attributes:
      label: What do we still need to learn?
      description: |
        [Rule 5](https://impatientprogramming.org/rules/#rule-5), the One Question: what's still unknown before this can be built? If it's unclear, [rule 15](https://impatientprogramming.org/rules/#rule-15): run a few cheap spikes and let them argue it out. Leave it empty if nothing is.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this deliberately doesn't do, so the Contract doesn't grow past what was agreed.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: Each **must** is something a contract test can observe from outside impish, not a detail of the code.
          required: true
        - label: This isn't a defect in a released version ([rule 9](https://impatientprogramming.org/rules/#rule-9)); for that, I'd use the Bug form.
          required: true
