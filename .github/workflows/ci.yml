name: CI

# One pipeline, one gate. Guardrails fire on every change (Impatient
# Programming, rule 24); `CI` is the only check main's ruleset requires, so
# green merges itself (rule 27), and every green merge that bumps the version
# is released (rule 3).
#
#   Format and Clippy ──┐
#   Dependency policy ──┤
#   Workflow security ──┤
#   Similar code (PRs) ─┼── Mutants (PRs) ─┬─ CI ── Release (main, new version)
#   Version (PRs) ──────┤                  │
#   Test ───────────────┘                  │
#   Portability ───────────────────────────┘
#
# Format and Clippy: fmt, clippy, unused dependencies, copy-paste outside Rust
#                    (jscpd, .jscpd.json), and the pipeline's own scripts
#                    (tests/pipeline).
# Dependency policy: cargo-deny; licences, sources, advisories (deny.toml).
# Workflow security: zizmor on these workflows.
# Similar code:      no new near-duplicate functions (scripts/similar-code.sh).
# Version:           a change to what ships bumps the version (scripts/shipped.sh).
# Test:              the suite, then `cargo impish check` on impish itself.
# Portability:       the suite on macOS and Windows; on macOS, the pipeline's
#                    scripts under its bash 3.2 too.
# Mutants:           every line the PR changes is mutated by cargo-mutants,
#                    in four shards; a survivor fails.
# Release:           publishes the crates and a GitHub release for a new version.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel on main: a cancelled run there would skip its release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Every step runs with -o pipefail, so `script | tee` fails when the script does.
defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-machete
      # A dependency nothing uses still costs build time and supply chain.
      - run: cargo machete
      # similarity-rs judges the Rust; jscpd finds copy-paste in the scripts,
      # workflows, Markdown and TOML, with .jscpd.json's formats and ignores.
      - name: No copy-paste outside Rust
        run: npx --yes jscpd@4.3.0 .
      # The gates' own scripts, against fakes of the slow tools: a gate that
      # can't fail is caught here, not on a PR that should have failed.
      - name: Pipeline scripts
        run: tests/pipeline/run.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: mutants
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test
      # impish holds its own Contract (rule 20).
      - run: cargo run --quiet -- check

  # Users run impish on macOS and Windows too.
  portability:
    name: Portability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test
      # The Lint job runs shellcheck; this checks the scripts run on bash 3.2.
      - name: Pipeline scripts under /bin/bash
        if: runner.os == 'macOS'
        run: tests/pipeline/run.sh
        env:
          BASH_UNDER_TEST: /bin/bash
          SHELLCHECK: '0'

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny
      - run: cargo deny check

  zizmor:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          annotations: true
          min-severity: low

  # Every test must prove it's worth keeping (rule 26): each line a PR changes
  # is mutated, and a mutant no test catches fails the PR.
  # Four shards, each its own runner, so a large diff doesn't queue its
  # mutants behind one another.
  mutants:
    name: Mutants (PR diff, ${{ matrix.shard }}/4)
    # The cheap checks first: a format slip shouldn't cost a mutation run.
    needs: [lint, deny, zizmor, test, similar, version]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Diff against base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/${BASE_REF}.." | tee git.diff
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: mutants
          # Never runs on main: Test saves this key there.
          save-if: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-mutants
      - env:
          SHARD: ${{ matrix.shard }}
        run: cargo mutants --workspace --no-shuffle -vV --in-place --in-diff git.diff --shard "${SHARD}/4"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants.out-${{ matrix.shard }}
          path: mutants.out

  # The exhale of rule 12: a function this PR adds or edits that looks like
  # another one fails, unless the pair is on the base already or declared in
  # scripts/similar-code.allow.
  similar:
    name: Similar code
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: similarity-rs
      - name: No new similar functions
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          status=0
          scripts/similar-code.sh "origin/${BASE_REF}" > report.txt || status=$?
          cat report.txt
          {
            echo "### Similar code"
            echo '```'
            sed -E 's/^::(warning|error) file=([^,]+),line=([0-9]+),title=Similar code::/\2:\3: \1: /' report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  version:
    name: Version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # What ships is what `cargo package` puts in the crates, README included,
      # so a green merge of any change users get is a release.
      # Dependabot can't bump the version, so its updates ship with the next release.
      - name: A change to what ships bumps the version
        env:
          BASE_REF: ${{ github.base_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          scripts/shipped.sh > "$RUNNER_TEMP/shipped"
          mapfile -t paths < "$RUNNER_TEMP/shipped"
          shipped=$(git diff --name-only "origin/${BASE_REF}..." -- "${paths[@]}")
          if [ -z "$shipped" ] || [ "$AUTHOR" = "dependabot[bot]" ]; then
            echo "Nothing that ships changed, or this is Dependabot; no bump needed."
            exit 0
          fi
          version() { sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1; }
          base=$(git show "origin/${BASE_REF}:Cargo.toml" | version)
          head=$(version < Cargo.toml)
          newest=$(printf '%s\n%s\n' "$base" "$head" | sort -V | tail -n 1)
          if [ "$head" = "$base" ] || [ "$newest" != "$head" ]; then
            echo "::error file=Cargo.toml::This PR changes what ships, so bump the version above $base (it is $head)."
            exit 1
          fi
          echo "Version $base -> $head"

  # Skipped jobs count as passed, so requiring the jobs above directly would
  # let a failure through; this one fails if anything failed or was cancelled.
  ci:
    name: CI
    needs: [lint, test, portability, deny, zizmor, mutants, similar, version]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac

  # Every green merge is a release (rule 3): a version without a GitHub release
  # gets one, tagged on this commit. A merge that didn't bump the version is
  # already released, so it is skipped.
  release:
    name: Release
    needs: ci
    # always(): the skipped PR-only jobs upstream would otherwise skip this job too.
    if: always() && needs.ci.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Publish this version if it is new
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released."
            exit 0
          fi
          got=$(cargo run --quiet -- --version)
          if [ "$got" != "cargo impish $version" ]; then
            echo "::error::the binary answered '$got', expected 'cargo impish $version'"
            exit 1
          fi
          # A rerun skips the crates an earlier attempt already published.
          publish() {
            local out
            if ! out=$(cargo publish --locked -p "$@" 2>&1); then
              echo "$out"
              grep -q "already exists" <<< "$out" || exit 1
            fi
          }
          publish impish-core
          publish impish
          # cargo-impish's tests use impish from crates.io. Packaging it turns
          # the path to impish-core into a crates.io one, which clashes with
          # the impish-core an older impish of the same minor version locks,
          # so move to the new one. Another minor version locks its own.
          old=$(awk '$0 == "name = \"impish\"" { getline v; getline s; if (s ~ /registry/) { gsub(/version = |"/, "", v); print v } }' Cargo.lock)
          if [ "$old" != "$version" ] && [ "${old%.*}" = "${version%.*}" ]; then
            cargo update -p "impish@$old" --precise "$version"
          fi
          # That update is the one change to the checkout.
          publish cargo-impish --allow-dirty
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
