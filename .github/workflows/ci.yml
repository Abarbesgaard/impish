name: CI

# Guardrails fire on every change (Impatient Programming, rule 24). The `CI`
# job at the end is the only check main's ruleset requires, so green merges
# itself (rule 27). On main, the Release job then publishes every new version
# (rule 3), and the Version job makes every PR that changes what ships bump it.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel on main: a cancelled run there would skip its release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test
      # impish holds its own Contract (rule 20).
      - run: cargo run --quiet -- check
      - name: Contract coverage
        run: |
          {
            echo "## Contract coverage"
            jq -r '
              (if .surface then "**Surface covered: \(.surface.percent)%** (\(.surface.covered) of \(.surface.total))\n" else "" end),
              "**Active obligations: \(.obligations)**\n",
              "| Primitive | Obligations | Surface |",
              "|---|---|---|",
              (.primitives | to_entries[] | "| \(.key) | \(.value.obligations) | \(.value.surface | join(", ")) |"),
              "",
              "| Kind | Obligations |",
              "|---|---|",
              (.kinds | to_entries[] | "| \(.key) | \(.value) |"),
              (if (.uncovered // []) | length > 0 then "\n**Not yet in the Contract:** \(.uncovered | join(", "))" else empty end)
            ' contract/coverage.json
          } >> "$GITHUB_STEP_SUMMARY"

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny
      - run: cargo deny check

  zizmor:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          annotations: true
          min-severity: low

  # Every test must prove it's worth keeping (rule 26): each line a PR changes
  # is mutated, and a mutant no test catches fails the PR.
  mutants:
    name: Mutants (PR diff)
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Diff against base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/${BASE_REF}.." | tee git.diff
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-mutants
      - run: cargo mutants --workspace --no-shuffle -vV --in-place --in-diff git.diff
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants.out
          path: mutants.out

  version:
    name: Version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Dependabot can't bump the version, so its updates ship with the next release.
      - name: A change to what ships bumps the version
        env:
          BASE_REF: ${{ github.base_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          shipped=$(git diff --name-only "origin/${BASE_REF}..." -- src Cargo.toml Cargo.lock)
          if [ -z "$shipped" ] || [ "$AUTHOR" = "dependabot[bot]" ]; then
            echo "Nothing that ships changed, or this is Dependabot; no bump needed."
            exit 0
          fi
          version() { sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1; }
          base=$(git show "origin/${BASE_REF}:Cargo.toml" | version)
          head=$(version < Cargo.toml)
          newest=$(printf '%s\n%s\n' "$base" "$head" | sort -V | tail -n 1)
          if [ "$head" = "$base" ] || [ "$newest" != "$head" ]; then
            echo "::error file=Cargo.toml::This PR changes what ships, so bump the version above $base (it is $head)."
            exit 1
          fi
          echo "Version $base -> $head"

  # Skipped jobs count as passed, so requiring the jobs above directly would
  # let a failure through; this one fails if anything failed or was cancelled.
  ci:
    name: CI
    needs: [lint, test, deny, zizmor, mutants, version]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac

  # Every green merge is a release (rule 3): a version without a GitHub release
  # gets one, tagged on this commit. A merge that didn't bump the version is
  # already released, so it is skipped.
  release:
    name: Release
    needs: ci
    # always(): the skipped PR-only jobs upstream would otherwise skip this job too.
    if: always() && needs.ci.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Publish this version if it is new
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released."
            exit 0
          fi
          got=$(cargo run --quiet -- --version)
          if [ "$got" != "cargo impish $version" ]; then
            echo "::error::the binary answered '$got', expected 'cargo impish $version'"
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
