name: Contract mutants

# Holds impish to its own Contract (rule 20), one job per primitive. CI calls
# this on a PR with `--only-lines`: only the covered lines the PR changes,
# since re-mutating all of `mutate` when its tests change takes hours. After
# the merge, each primitive runs plain `mutate --since` against the commit
# before the push, so a changed Contract or contract test is held against all
# the code it covers. A failure on main is red there and needs a fix PR; it
# doesn't hold back the release. `mutate` is held only after the merge: each
# of its mutants runs cargo-mutants in turn, and on a PR that took 26 minutes.

on:
  push:
    branches: [main]
    paths: ["src/**", "impish/**", "contract/**", "tests/contract/**"]
  workflow_dispatch:
    inputs:
      since:
        description: "Ref to mutate the changes since"
        required: false
        default: "HEAD~1"
  workflow_call:
    inputs:
      since:
        type: string
        required: true
      only-lines:
        type: boolean
        default: false
      skip:
        description: "Primitives held only after the merge"
        type: string
        default: ""

permissions: {}

concurrency:
  group: contract-mutants-${{ github.ref }}
  # Never cancel on main: each push's changes are mutated only once.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Every step runs with -o pipefail, so `script | tee` fails when the script does.
defaults:
  run:
    shell: bash

jobs:
  primitives:
    name: Primitives
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      list: ${{ steps.ls.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ls
        env:
          SKIP: ${{ inputs.skip }}
        run: |
          list=$(for f in contract/*/README.md; do
            if grep -q '^```covers' "$f"; then basename "$(dirname "$f")"; fi
          done | grep -vxF -e "${SKIP:-}" | jq -Rnc '[inputs]')
          echo "list=$list" >> "$GITHUB_OUTPUT"

  mutate:
    name: Contract mutants (${{ matrix.primitive }})
    needs: primitives
    runs-on: ubuntu-latest
    # A change to mutate's Contract mutates all of it, and each of its mutants
    # runs cargo-mutants in turn.
    timeout-minutes: ${{ inputs.only-lines && 60 || 300 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        primitive: ${{ fromJSON(needs.primitives.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: mutants
          save-if: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-mutants
      - name: Mutate what changed
        env:
          BEFORE: ${{ github.event.before }}
          INPUT: ${{ inputs.since }}
          ONLY_LINES: ${{ inputs.only-lines }}
          PRIMITIVE: ${{ matrix.primitive }}
        run: |
          flags=()
          if [ "$ONLY_LINES" = true ]; then flags=(--only-lines); fi
          cargo run -q -- impish mutate "$PRIMITIVE" --since "${INPUT:-$BEFORE}" "${flags[@]}" 2>&1 | tee mutate.txt
      - name: Kill matrix
        if: always()
        run: |
          [ -f mutate.txt ] || exit 0
          { echo '```'; cat mutate.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
