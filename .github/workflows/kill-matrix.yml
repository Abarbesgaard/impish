name: Kill matrix

# Finds tests that catch nothing another test doesn't already catch (Impatient
# Programming, rule 26). Every mutant runs the whole suite, so a full sweep
# takes hours: each night runs one of 16 shards (~10 mutants) and the results
# add up on the kill-matrix-data branch. Every 16 nights the whole workspace is
# covered, then the cycle starts over. Once every shard has run, it files an
# issue (label kill-matrix, at most 3 a night) per test that adds nothing;
# closing one means "keep it". Never runs on PRs: `cargo impish mutate` and the
# CI Mutants job guard those.

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      shard:
        description: "Shard to run (0-15); empty picks tonight's"
        required: false

permissions: {}

concurrency:
  group: kill-matrix
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SHARDS: 16

# Every step runs with -o pipefail, so `script | tee` fails when the script does.
defaults:
  run:
    shell: bash

jobs:
  sweep:
    name: Kill matrix (one shard)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The results so far; the first run starts the branch.
      - name: Fetch results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone -q --depth 1 --branch kill-matrix-data "$url" kill-matrix-data 2>/dev/null; then
            git init -q -b kill-matrix-data kill-matrix-data
          fi

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: mutants
          save-if: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-mutants

      - name: Pick shard
        id: shard
        env:
          INPUT: ${{ inputs.shard }}
        run: echo "k=${INPUT:-$(( $(date -u +%s) / 86400 % SHARDS ))}" >> "$GITHUB_OUTPUT"

      - name: Sweep
        env:
          KILLMX_JOBS: "2"
          K: ${{ steps.shard.outputs.k }}
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/kill-matrix.sh --shard "$K/$SHARDS" --data kill-matrix-data --file-issues \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save results
        working-directory: kill-matrix-data
        env:
          K: ${{ steps.shard.outputs.k }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898475+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Kill matrix: shard $K/$SHARDS at ${GITHUB_SHA::7}"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:kill-matrix-data
