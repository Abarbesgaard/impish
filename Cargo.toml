[package]
name = "impish"
version = "0.1.0"
edition = "2024"
description = "The Contract gate for Rust, after Impatient Programming"
publish = false

[[bin]]
name = "cargo-impish"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }

[[test]]
name = "contract"
path = "tests/contract/main.rs"
