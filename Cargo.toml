[workspace]
members = ["impish"]

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false

[package]
name = "cargo-impish"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The Contract gate for Rust, after Impatient Programming"

[[bin]]
name = "cargo-impish"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[[test]]
name = "contract"
path = "tests/contract/main.rs"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
