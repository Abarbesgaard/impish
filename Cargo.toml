[workspace]
members = ["core", "impish"]

[workspace.package]
version = "0.4.0"
edition = "2024"
publish = false

[package]
name = "cargo-impish"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The Contract gate for Rust, after Impatient Programming"

[[bin]]
name = "cargo-impish"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
impish-core = { path = "core" }
proc-macro2 = { version = "1", features = ["span-locations"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = { version = "3", features = ["full", "visit"] }
toml = "1.1.8"

[[test]]
name = "contract"
path = "tests/contract/main.rs"

[dev-dependencies]
impish = { path = "impish" }
serde_json = "1.0.154"
tempfile = "3.27.0"
