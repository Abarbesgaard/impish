[workspace]
members = ["core", "impish"]

[workspace.package]
version = "0.6.20"
edition = "2024"
license = "MIT"
repository = "https://github.com/Abarbesgaard/impish"

# Published crates need a version on every path dependency. A caret
# requirement keeps matching as the workspace version moves, until 0.7.
[workspace.dependencies]
impish-core = { path = "core", version = "0.6.20" }

[package]
name = "cargo-impish"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
# What the crate ships; CI's version job bumps on a change to any of it.
include = ["/src/**", "/README.md", "/LICENSE"]
description = "The Contract gate for Rust, after Impatient Programming"

# proc-macro2 is here only for span-locations, which gives syn's spans their
# line numbers; machete can't see a dependency used only for its feature.
[package.metadata.cargo-machete]
ignored = ["proc-macro2"]

[[bin]]
name = "cargo-impish"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
impish-core.workspace = true
proc-macro2 = { version = "1", features = ["span-locations"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = { version = "3", features = ["full", "visit"] }
toml = "1.1.8"

[[test]]
name = "contract"
path = "tests/contract/main.rs"

[dev-dependencies]
archunit = "0.0.2"
# Tags this crate's own tests with the published attribute, not the one in
# impish/: mutating the attribute must not rewrite the tests that catch it.
# The fixtures in tests/contract build against impish/.
impish = "0.6"
serde_json = "1.0.154"
tempfile = "3.27.0"
